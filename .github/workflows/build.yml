name: build Dylib

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer

      - name: Setup Theos & Dependencies
        run: |
          brew install ldid
          git clone --recursive https://github.com/theos/theos.git $HOME/theos
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV

      - name: Compile Dylib
        run: |
          make clean
          make FINALPACKAGE=1

      - name: Locate and Package Dylib
        run: |
          mkdir -p output
          DYLIB_PATH=$(find .theos/obj -name "*.dylib" | head -n 1)
          if [ -z "$DYLIB_PATH" ]; then
            echo "Error: .dylib file not found!"
            exit 1
          fi
          echo "Found dylib at $DYLIB_PATH"
          cp "$DYLIB_PATH" output/MySpotifyTheme.dylib

      - name: Upload Dylib Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MySpotifyTheme-dylib
          path: output/MySpotifyTheme.dylib
