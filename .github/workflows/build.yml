name: Build Dylib

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git $HOME/theos
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV

      - name: Install Theos SDK (iphoneos)
        run: |
          git clone -n --depth=1 https://github.com/theos/sdks.git /tmp/sdks
          cd /tmp/sdks
          git sparse-checkout set --no-cone 'iPhoneOS14.5.sdk'
          git checkout
          mkdir -p $THEOS/sdks
          mv iPhoneOS14.5.sdk $THEOS/sdks/

      - name: Install ldid
        run: brew install ldid

      - name: Build tweak package
        run: make package FINALPACKAGE=1

      - name: Upload dylib
        uses: actions/upload-artifact@v4
        with:
          name: EeveeThemeEngine-dylib
          path: .theos/obj/FINALPACKAGE/EeveeThemeEngine.dylib

