name: Build Dylib

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Theos
        run: |
          bash -c "$(curl -fsSL https://raw.githubusercontent.com/theos/theos/master/bin/install-theos)"
          echo "THEOS=/Users/runner/theos" >> $GITHUB_ENV

      - name: Build Package
        run: |
          make package FINALPACKAGE=1 2>&1 | tee build.log

      - name: Trigger Replit Auto-Fixer on Failure
        if: failure()
        run: |
          ERROR_LOG=$(cat build.log | tail -n 100 | jq -sR .)
          curl -X POST "https://rw4s.riker.replit.dev/api/repair-intake" \
            -H "Content-Type: application/json" \
            -d "{
                  \"repo\": \"${{ github.repository }}\",
                  \"branch\": \"${{ github.ref_name }}\",
                  \"commit_sha\": \"${{ github.sha }}\",
                  \"error_log\": $ERROR_LOG
                }"
