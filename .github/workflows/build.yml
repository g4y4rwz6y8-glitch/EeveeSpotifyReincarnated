name: Build Tweak

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git $HOME/theos
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV

      - name: Install Theos SDK (iphoneos)
        run: |
          mkdir -p $THEOS/sdks
          curl -LO https://github.com/theos/sdks/archive/master.zip
          unzip master.zip
          mv sdks-master/iPhoneOS14.5.sdk $THEOS/sdks/
          rm -rf sdks-master master.zip

      - name: Install ldid
        run: brew install ldid

      - name: Build tweak package
        run: make package FINALPACKAGE=1

      - name: Extract dylib
        run: |
          mkdir -p extracted
          find .theos/ -name "*.dylib" -exec cp {} extracted/ \;

      - name: Upload dylib artifact
        uses: actions/upload-artifact@v4
        with:
          name: EeveeThemeEngine-dylib
          path: extracted/*.dylib
